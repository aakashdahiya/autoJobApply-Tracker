<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Job Tracker</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <div class="actions">
        <button id="capture" class="primary">Save this job</button>
        <button id="fill" class="primary alt">Fill this form</button>
      </div>
      <label class="shape">
        Resume shape
        <select id="shape">
          <option value="ai_engineer">AI engineer</option>
          <option value="backend_python">Backend / Python</option>
          <option value="fullstack">Full-stack</option>
        </select>
      </label>
      <div id="stats" class="stats"></div>
    </header>

    <div class="filters">
      <input id="search" type="search" placeholder="Filter by title…" />
      <select id="status">
        <option value="">All statuses</option>
        <option value="open">Open only</option>
        <option value="discovered">Discovered</option>
        <option value="ready">Ready</option>
        <option value="applied">Applied</option>
        <option value="interview">Interview</option>
        <option value="rejected">Rejected</option>
      </select>
    </div>

    <p id="message" class="message" hidden></p>

    <!-- Shown only when driving claude.ai failed. The prompt is already built,
         so the work is never lost: copy it, paste the reply back. -->
    <section id="manual" class="manual" hidden>
      <h2 class="manual-title"></h2>
      <p class="manual-help">
        Could not read the reply out of claude.ai. Copy this prompt, paste it
        there, then paste Claude's whole reply back below.
      </p>
      <textarea class="manual-prompt" rows="4" readonly></textarea>
      <div class="manual-buttons">
        <button class="manual-copy">Copy prompt</button>
        <button class="manual-close">Close</button>
      </div>
      <textarea class="manual-reply" rows="5"
                placeholder="Paste Claude's reply here…"></textarea>
      <button class="manual-submit primary">Use this reply</button>
    </section>

    <ul id="jobs" class="jobs"></ul>

    <script src="sidepanel.js"></script>
  </body>
</html>
