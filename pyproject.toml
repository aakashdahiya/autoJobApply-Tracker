[project]
name = "autojobapply-tracker"
version = "0.1.0"
description = "Semi-automated job application system for Canadian AI/tech/Python roles"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typst>=0.11",
    "python-docx>=1.1",
    "pdfminer.six>=20231228",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
