[project]
name = "autojobapply-tracker"
version = "0.1.0"
description = "Semi-automated job application system for Canadian AI/tech/Python roles"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typst>=0.11",
    "python-docx>=1.1",
    "pdfminer.six>=20231228",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "keyring>=24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Only needed for `--rephrase`. Everything else runs without a model.
llm = ["anthropic>=0.40"]
# Only needed to read your inbox. Triage itself is testable without it.
gmail = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
