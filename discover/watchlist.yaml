# Canadian employers that hire Python / AI / backend engineers.
# `slugs` are candidate job-board tokens to probe; `detect.py` finds which ATS
# each company actually uses rather than guessing, because that changes.
# Enterprises on Workday need their tenant URL filled in by hand — there is no
# way to derive `<employer>.wdN.myworkdayjobs.com` from a company name.

companies:
  # --- AI / ML first -----------------------------------------------------
  - {name: Cohere,            city: Toronto,    slugs: [cohere]}
  - {name: Waabi,             city: Toronto,    slugs: [waabi]}
  - {name: Ada,               city: Toronto,    slugs: [ada, adasupport]}
