# EXAMPLE fact bank — every value here is placeholder. Copy to profile.yaml and
# replace with your own history. profile.yaml is gitignored because it holds
# personal data.
#
# The rule this file exists to enforce: nothing reaches a rendered resume that
# is not a `fact` below. Tailoring reorders and re-weights these; it never adds.
# Tag each fact with the role shapes it genuinely supports — one shape is
# chosen per application, so breadth here costs nothing.

identity:
  name: Your Name
  email: you@example.com
  phone: "+1 647 555 0123"
  city: Toronto
  province: ON
  links:
    linkedin: linkedin.com/in/yourname
    github: github.com/yourname

constraints:
  work_auth: work_permit
  permit_type: open          # PGWP is an open permit; derives the sponsorship answer
  permit_subtype: pgwp
  work_auth_expiry: 2027-12-31
  citizenship: India
  credential_assessment: null   # WES ECA reference, if you hold one
  provinces: [canada-wide]
  work_modes: [remote, hybrid, onsite]
  relocate_within_canada: true
  expected_base_cad:
    min: 120000
    target: 145000
  notice_period_days: 30
  french_level: none

self_id:                     # voluntary; quoted for clarity (the loader keeps them strings)
  mode: disclose
  gender: man
  indigenous: "no"
  racialized: "yes"
  racialized_group: south_asian
  disability: "no"
  veteran: "no"

skills:
  Languages: [python, sql, go, typescript]
  Machine learning: [pytorch, scikit-learn, mlflow, transformers, model-evaluation]
  Data and infrastructure:
    [postgresql, redis, kafka, airflow, spark, docker, kubernetes, terraform, aws]
  Practices: [ci-cd, observability, ab-testing]

# How skills are printed. Stored canonically and lowercased so keyword matching
# against a job description stays reliable; only the label reaches the page.
skill_labels:
  python: Python
  sql: SQL
  go: Go
  typescript: TypeScript
  pytorch: PyTorch
  scikit-learn: scikit-learn
  mlflow: MLflow
  transformers: Transformers
  model-evaluation: model evaluation
  postgresql: PostgreSQL
  redis: Redis
  kafka: Kafka
  airflow: Airflow
  spark: Spark
  docker: Docker
  kubernetes: Kubernetes
  terraform: Terraform
  aws: AWS
  ci-cd: CI/CD
  observability: observability
  ab-testing: A/B testing

experience:
  - id: r_ml
    title: ML Platform Engineer
    company: Northwind Analytics
    location: Toronto, ON
    start: 2024-01
  - id: r_backend
    title: Senior Backend Engineer
    company: Meridian Software
    location: Pune, India
    start: 2021-01
    end: 2022-07
  - id: r_data
    title: Data Engineer
    company: Kestrel Labs
    location: Pune, India
    start: 2018-07
    end: 2020-12

education:
  - credential: MEng, Computer Engineering
    institution: University of Waterloo
    location: Waterloo, ON
    start: 2022-09
    end: 2023-12
  - credential: BE, Computer Science
    institution: Savitribai Phule Pune University
    location: Pune, India
    end: 2018-05

summary:
  ml_platform: >-
    ML platform engineer with six years across data and backend systems, focused on
    getting models served reliably and cheaply in production.
  product_python: >-
    Backend engineer with six years in Python and SQL, building APIs and data models
    that stay correct under load.
  research: >-
    Engineer with six years in production ML and data systems, working on evaluation
    and model quality alongside the platform that serves them.

