# EXAMPLE fact bank — every value is placeholder. Copy to profile.yaml and
# replace with your own history; profile.yaml is gitignored because it holds
# personal data.
#
# The rule this file exists to enforce: nothing reaches a rendered resume that
# is not a `fact` below. Tailoring reorders and re-weights these; it never adds.
# `**bold**` inside a bullet renders bold, and every check runs on the stripped
# text so markup cannot smuggle a claim past a validator.

identity:
  name: Your Name
  email: you@example.com
  phone: "+1 647 555 0123"
  city: Ajax
  province: ON
  area: Toronto Area
  links:
    - yourname.com
    - linkedin.com/in/yourname
    - github.com/yourname

constraints:
  work_auth: work_permit
  permit_type: open          # PGWP is an open permit; derives the sponsorship answer
  permit_subtype: pgwp
  work_auth_expiry: 2028-06-30
  citizenship: India
  credential_assessment: null
  provinces: [canada-wide]
  work_modes: [remote, hybrid, onsite]
  relocate_within_canada: true
  expected_base_cad: "flexible / open to market rate"
  notice_period_days: 0
  french_level: none

# Free-text answers to the questions no rule can derive. Matched by substring.
answers:
  how did you hear about us: Company careers page
  why do you want to work here: ""      # left blank on purpose; write it per application

self_id:                     # voluntary; quoted for clarity
  mode: disclose
  gender: man
  indigenous: "no"
  racialized: "yes"
  racialized_group: south_asian
  disability: "no"
  veteran: "no"

# The line under the name. Changes with the role being applied for.
headline:
  ai_engineer: Python & AI Engineer
  backend_python: Python & Backend Engineer
  fullstack: Full-Stack Engineer (Next.js + Python)

summary:
  ai_engineer: >-
    AI engineer who builds and ships LLM-powered products end to end: retrieval-augmented
    generation, vision pipelines, and the Python services around them.
  backend_python: >-
    Python engineer building the FastAPI services and data layer behind LLM-powered
    products.
  fullstack: >-
    Full-stack engineer who ships end to end, from the product surface to the Python
    services behind it.

skills:
  Languages: [Python, JavaScript, SQL, HTML/CSS]
  AI / ML: [LLM APIs, RAG, embeddings, semantic search, prompt engineering]
  Backend & Data: [FastAPI, SQLAlchemy, SQLite, REST APIs]
  Frontend: [Next.js, React]
  Tools: [Git/GitHub]

experience:
  - id: r_example
    title: Software Developer
    company: Example Co
    location: Toronto, ON
    start: 2024-06
    tech: [Next.js, React, Postgres, REST APIs]

projects:
  - id: p_example
    name: ExampleProject
    tagline: RAG Q&A over your own documents
    tech: [Python, FastAPI, sentence-transformers]
    link: github.com/yourname/exampleproject

education:
  - credential: MSc, Computer Science
    institution: Example University
    location: Thunder Bay, ON
    end: "2024"
    note: "Relevant coursework: Pattern Recognition"
  - credential: Bachelor of Computer Applications (BCA)
    institution: Example Institute
    location: New Delhi
    end: "2022"

facts:
  - id: f_conversion
    role: r_example
    bullet: >-
      Increased lead conversion by **35%** by replacing a manual, call-based quoting
      process with an online quote wizard.
    shapes: [fullstack]
    skills: [nextjs, product]
    strength: 5

  - id: f_web_app
    role: r_example
    bullet: >-
      Built a lead-generation web app (**Next.js, Postgres**) that gives customers instant
      quotes.
    shapes: [fullstack]
    skills: [nextjs, postgres]
    strength: 4

  - id: f_vision_listing
    role: r_example
    bullet: >-
      Built an AI listing generator that turns item photos into product titles and
      descriptions using a vision model.
    shapes: [ai_engineer, fullstack]
    skills: [llm, vision]
    strength: 5

  - id: f_shared_backend
    role: r_example
    bullet: >-
      Connected two apps through a shared Postgres backend with a one-click publish flow.
    shapes: [fullstack, backend_python]
    skills: [postgres, data-modelling]
    strength: 4

  - id: f_attribution
    role: r_example
    bullet: >-
      Built keyword-level lead attribution so the admin dashboard shows the search term
      behind each enquiry.
    shapes: [fullstack, backend_python]
    skills: [analytics, rest-apis]
    strength: 4

  - id: f_checkout
    role: r_example
    bullet: >-
      Implemented checkout with order confirmations and an admin panel with a pricing
      editor.
    shapes: [fullstack]
    skills: [nextjs, rest-apis]
    strength: 3

  - id: f_rag
    project: p_example
    bullet: >-
      Built a full-stack RAG app that chunks documents, embeds them with
      **all-MiniLM-L6-v2**, retrieves by cosine similarity, and generates grounded answers.
    shapes: [ai_engineer, backend_python, fullstack]
    skills: [rag, embeddings, python]
    strength: 5

  - id: f_fastapi
    project: p_example
    bullet: >-
      Designed a FastAPI backend with an embedding cache and a vanilla HTML/JS frontend.
    shapes: [backend_python, ai_engineer, fullstack]
    skills: [fastapi, python, caching]
    strength: 4

  - id: f_dtype
    project: p_example
    bullet: >-
      Debugged a float32/float64 dtype mismatch that corrupted similarity scores after
      caching.
    shapes: [backend_python, ai_engineer]
    skills: [python, debugging]
    strength: 4
